[build-system]
requires = [
  "ninja",
  "setuptools>=77.0.3,<81.0.0",
  "torch==2.11.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "flash-rwkv"
version = "0.1.0"
description = "Source-attributed RWKV-7 recurrent inference CUDA kernel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
]
license = "MIT"

[dependency-groups]
dev = [
  "pytest>=8",
]

[project.urls]
Repository = "https://github.com/rwkv-rs/FlashRWKV"

[tool.setuptools.packages.find]
include = ["flash_rwkv", "flash_rwkv.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = ["tests_old", "benchmarks_old"]
python_files = ["test.py", "test_*.py"]
