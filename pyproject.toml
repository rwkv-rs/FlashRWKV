[build-system]
requires = [
  "ninja",
  "setuptools>=77.0.3,<81.0.0",
  "torch==2.11.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "flash-rwkv"
version = "0.1.0"
description = "RWKV-7 reference, recurrent, and chunk CUDA kernels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
]
license = "MIT"

[project.urls]
Repository = "https://github.com/rwkv-rs/FlashRWKV"

[tool.setuptools]
packages = ["flash_rwkv"]

[tool.setuptools.package-data]
flash_rwkv = ["chunk-tuning-v1.json"]
