name: Quick contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Create source-test environment
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python torch pytest ruff
      - name: Lint maintained public contracts
        run: |
          .venv/bin/ruff check \
            benchmarks/rl_infctx/wkv7/benchmark_rl_infctx_chunk_fp32io16_forward.py \
            benchmarks/infer/recurrent/benchmark_infer_recurrent_fp16_fp32io16_forward_varlen.py \
            benchmarks/statetune/wkv7/benchmark_statetune_recurrent_fp32io16_backward.py \
            flash_rwkv/architecture.py \
            flash_rwkv/benchmark_contract.py \
            flash_rwkv/channel_mix.py \
            flash_rwkv/head_l2wrap_ce.py \
            flash_rwkv/inference_blocks.py \
            flash_rwkv/l2wrap_ce.py \
            flash_rwkv/ops.py \
            flash_rwkv/provenance.py \
            flash_rwkv/registry.py \
            flash_rwkv/time_mix.py \
            setup.py \
            tests/test_architecture.py \
            tests/pretrain/wkv7/test_pretrain_cmix_bf16_forward_backward.py \
            tests/pretrain/wkv7/test_pretrain_head_l2wrap_ce_bf16_forward.py \
            tests/infer/fused/test_infer_fused_fp16_forward.py \
            tests/infer/recurrent/test_infer_recurrent_fp16_fp32io16_forward_varlen.py \
            tests/pretrain/wkv7/test_pretrain_l2wrap_ce_bf16_forward_backward.py \
            tests/test_benchmark_contract.py \
            tests/test_native_source_layout.py \
            tests/test_provenance.py \
            tests/test_registry.py \
            tests/racecheck/fused_operators.py \
            tests/pretrain/wkv7/test_pretrain_tmix_bf16_forward_backward.py
      - name: Run CPU contract tests
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONPATH: ${{ github.workspace }}
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_architecture.py \
            tests/test_benchmark_contract.py \
            tests/test_config.py \
            tests/infer/fused/test_infer_fused_fp16_forward.py \
            tests/infer/recurrent/test_infer_recurrent_fp16_fp32io16_forward_varlen.py \
            tests/test_native_source_layout.py \
            tests/test_provenance.py \
            tests/test_registry.py
