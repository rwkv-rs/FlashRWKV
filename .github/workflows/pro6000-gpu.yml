name: PRO 6000 GPU test, racecheck, and benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: flash-rwkv-pro6000-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-source:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: [self-hosted, linux, x64, rwkv-sha-pro6000x8]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Prepare isolated CUDA build
        run: |
          uv venv --python 3.12
          uv sync --no-install-project
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation -e .
      - name: Verify controlled GPU target
        run: |
          .venv/bin/python - <<'PY'
          import torch
          expected = "NVIDIA RTX PRO 6000 Blackwell Workstation Edition"
          actual = torch.cuda.get_device_name(0)
          if actual != expected:
              raise SystemExit(f"expected {expected!r}, got {actual!r}")
          print(actual)
          PY
      - name: Run complete CUDA test suite
        run: |
          mkdir -p artifacts
          set -o pipefail
          .venv/bin/python -m pytest -q | tee artifacts/pytest.log
      - name: Run Compute Sanitizer racecheck
        run: |
          set -o pipefail
          tests/racecheck/run.sh | tee artifacts/racecheck.log
      - name: Run fused operator benchmark
        run: |
          .venv/bin/python benchmarks/operator_benchmark.py \
            --output artifacts/operator-benchmark.json
          .venv/bin/python benchmarks/training_operator_benchmark.py \
            --output artifacts/training-operator-benchmark.json
      - name: Record immutable run identity
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          .venv/bin/python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          files = sorted(Path("artifacts").glob("*"))
          inventory = []
          for path in files:
              inventory.append({
                  "path": path.name,
                  "size_bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          Path("artifacts/run-identity.json").write_text(json.dumps({
              "head_sha": os.environ["HEAD_SHA"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "files": inventory,
          }, indent=2, sort_keys=True) + "\n")
          PY
      - name: Upload revision-bound evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: flash-rwkv-pro6000-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Update pull request report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        with:
          script: |
            const marker = '<!-- flash-rwkv-pro6000-report -->';
            const body = [
              marker,
              '### FlashRWKV PRO 6000 GPU report',
              '',
              `- Head: \`${context.payload.pull_request.head.sha}\``,
              `- Test/racecheck/benchmark run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Artifact SHA-256: \`${process.env.ARTIFACT_DIGEST}\``,
              '- Runner contract: `rwkv-sha-pro6000x8`, single NVIDIA RTX PRO 6000 Blackwell Workstation Edition',
            ].join('\n');
            const {data: comments} = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  untrusted-fork-notice:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Native CUDA from untrusted pull requests is not executed on the self-hosted GPU runner."
          echo "A maintainer must review the revision and dispatch this workflow explicitly."
