name: PRO 6000 GPU test, racecheck, and benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing FlashRWKV pull request number to update
        required: true
        type: number
      source_revision:
        description: Exact approved pull request head revision
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: flash-rwkv-pro6000-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-source:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: [self-hosted, linux, x64, rwkv-sha-pro6000x8]
    timeout-minutes: 90
    env:
      TORCH_CUDA_ARCH_LIST: "12.0"
    steps:
      - name: Resolve target PR and exact revision
        id: target
        uses: actions/github-script@v7
        env:
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          DISPATCH_SOURCE_REVISION: ${{ inputs.source_revision }}
        with:
          script: |
            let prNumber;
            let sourceRevision;
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              sourceRevision = context.payload.pull_request.head.sha;
            } else {
              prNumber = Number(process.env.DISPATCH_PR_NUMBER);
              sourceRevision = process.env.DISPATCH_SOURCE_REVISION;
              if (!Number.isInteger(prNumber) || prNumber <= 0) {
                core.setFailed(`invalid pull request number: ${process.env.DISPATCH_PR_NUMBER}`);
                return;
              }
              if (!/^[0-9a-f]{40}$/.test(sourceRevision)) {
                core.setFailed(`source_revision must be a full lowercase Git OID: ${sourceRevision}`);
                return;
              }
              if (context.sha !== sourceRevision) {
                core.setFailed(`dispatch ref resolved to ${context.sha}, not ${sourceRevision}`);
                return;
              }
            }
            const {data: pull} = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            });
            if (pull.state !== 'open') {
              core.setFailed(`pull request #${prNumber} is not open`);
              return;
            }
            if (pull.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed(`pull request #${prNumber} is not an in-repository branch`);
              return;
            }
            if (pull.head.sha !== sourceRevision) {
              core.setFailed(`pull request head is ${pull.head.sha}, not ${sourceRevision}`);
              return;
            }
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_sha', sourceRevision);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify clean tracked source checkout
        env:
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          PREBUILD_PROVENANCE: ${{ runner.temp }}/flash-rwkv-prebuild-provenance.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*arguments):
              return subprocess.run(
                  ("git", *arguments),
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()

          head_sha = git("rev-parse", "HEAD")
          runtime_semantic_revision = git(
              "log",
              "-1",
              "--format=%H",
              "--",
              "csrc",
              "flash_rwkv",
              "setup.py",
          )
          tracked_status = git("status", "--short", "--untracked-files=no")
          worktree_diff_paths = git("diff", "--name-only").splitlines()
          index_diff_paths = git("diff", "--cached", "--name-only").splitlines()
          payload = {
              "head_sha": head_sha,
              "expected_head_sha": os.environ["HEAD_SHA"],
              "runtime_semantic_revision": runtime_semantic_revision,
              "tracked_source_dirty": bool(tracked_status),
              "index_dirty": bool(index_diff_paths),
              "tracked_status_entries": tracked_status.splitlines(),
              "worktree_diff_paths": worktree_diff_paths,
              "index_diff_paths": index_diff_paths,
              "controlled_generated_path_patterns": [
                  ".venv/**",
                  "artifacts/**",
                  "build/**",
                  "*.egg-info/**",
                  "*.so",
                  ".cache/**",
                  ".pytest_cache/**",
                  ".ruff_cache/**",
                  "__pycache__/**",
                  "**/__pycache__/**",
              ],
          }
          if (
              head_sha != payload["expected_head_sha"]
              or payload["tracked_source_dirty"]
              or payload["index_dirty"]
              or worktree_diff_paths
          ):
              raise SystemExit(f"unclean or mismatched source checkout: {payload}")
          Path(os.environ["PREBUILD_PROVENANCE"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Prepare isolated CUDA build
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python \
            'torch>=2.4' 'pytest==9.1.1' 'einops' 'transformers>=4.45.0'
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation -e .
          uv pip install --python .venv/bin/python --no-deps \
            'flash-linear-attention @ git+https://github.com/rwkv-rs/fla-rwkv.git@fcd4502ab957513a3d97dbd8aa64851e5e4dba11'
          .venv/bin/python - <<'PY'
          import importlib
          import importlib.metadata
          import json
          from pathlib import Path

          revision = "fcd4502ab957513a3d97dbd8aa64851e5e4dba11"
          distribution = importlib.metadata.distribution("flash-linear-attention")
          direct_url = json.loads(distribution.read_text("direct_url.json"))
          if direct_url["url"] != "https://github.com/rwkv-rs/fla-rwkv.git":
              raise SystemExit(f"unexpected FLA repository: {direct_url['url']}")
          vcs_info = direct_url["vcs_info"]
          if vcs_info.get("commit_id") != revision:
              raise SystemExit(f"unexpected FLA commit: {vcs_info.get('commit_id')}")
          package_root = Path(distribution.locate_file("fla")).resolve()
          for name in ("fla", "fla.ops.rwkv7"):
              module_path = Path(importlib.import_module(name).__file__).resolve()
              if not module_path.is_relative_to(package_root):
                  raise SystemExit(
                      f"{name} resolved outside pinned distribution: {module_path}"
                  )
              print(f"{name}={module_path}")
          PY
      - name: Cross-compile architecture matrix
        run: |
          set -o pipefail
          mkdir -p artifacts build/architecture-matrix
          if TORCH_CUDA_ARCH_LIST=8.0 .venv/bin/python setup.py build_ext \
            --force \
            --build-temp build/architecture-matrix/sm80-temp \
            --build-lib build/architecture-matrix/sm80-lib \
            > artifacts/architecture-sm80.log 2>&1; then
            echo "SM80 build unexpectedly succeeded" >&2
            exit 1
          fi
          grep -F \
            "requires compute capability >= 9.0" \
            artifacts/architecture-sm80.log
          for target in 9.0 12.0; do
            label="sm${target/./}"
            TORCH_CUDA_ARCH_LIST="$target" .venv/bin/python setup.py build_ext \
              --force \
              --build-temp "build/architecture-matrix/${label}-temp" \
              --build-lib "build/architecture-matrix/${label}-lib" \
              2>&1 | tee "artifacts/architecture-${label}.log"
          done
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "wheel_minimum_architecture": "sm90",
              "targets": [
                  {"architecture": "sm80", "status": "fail_closed"},
                  {"architecture": "sm90", "status": "compile_only"},
                  {"architecture": "sm120", "status": "compile_only"},
              ],
              "runtime_validated_architectures": ["sm120"],
          }
          Path("artifacts/architecture-matrix.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Verify controlled GPU target
        run: |
          command -v compute-sanitizer
          compute-sanitizer --version
          .venv/bin/python - <<'PY'
          import torch
          expected = "NVIDIA RTX PRO 6000 Blackwell Workstation Edition"
          actual = torch.cuda.get_device_name(0)
          if actual != expected:
              raise SystemExit(f"expected {expected!r}, got {actual!r}")
          capability = torch.cuda.get_device_capability(0)
          if capability != (12, 0):
              raise SystemExit(f"expected compute capability (12, 0), got {capability}")
          print(actual)
          print(f"compute_capability={capability[0]}.{capability[1]}")
          PY
      - name: Run complete CUDA test suite
        run: |
          mkdir -p artifacts
          set -o pipefail
          .venv/bin/python -m pytest -q | tee artifacts/pytest.log
      - name: Run Compute Sanitizer racecheck
        run: |
          set -o pipefail
          tests/racecheck/run.sh | tee artifacts/racecheck.log
      - name: Run correctness-gated benchmarks
        run: |
          .venv/bin/python benchmarks/infer/wkv7/benchmark_infer_fused_fp16_forward.py \
            --output artifacts/operator-benchmark.json
          .venv/bin/python benchmarks/pretrain/wkv7/benchmark_pretrain_operators_bf16_forward_backward.py \
            --output artifacts/training-operator-benchmark.json
          .venv/bin/python benchmarks/statetune/wkv7/benchmark_statetune_recurrent_fp32io16_backward.py \
            --output artifacts/statetune-benchmark.json
          .venv/bin/python benchmarks/rl_infctx/wkv7/benchmark_rl_infctx_chunk_fp32io16_forward.py \
            --output artifacts/rl-infctx-benchmark.json
          .venv/bin/python benchmarks/infer/wkv7/benchmark_infer_recurrent_fp16_fp32io16_forward_varlen.py \
            --profiles decode_b320 equal_chunk16_b320 ragged_chunk16_b320 \
            decode_b2048 \
            --modes fp32io16 fp16 \
            --warmup-iters 3 \
            --samples 10 \
            --stateful-sample-iters 10 \
            --output artifacts/packed-recurrent-benchmark.json
      - name: Record immutable run identity
        env:
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          PREBUILD_PROVENANCE: ${{ runner.temp }}/flash-rwkv-prebuild-provenance.json
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          .venv/bin/python - <<'PY'
          import fnmatch
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def metric(value):
              return str(round(float(value), 6))

          generated_path_allowlist = (
              ".venv/**",
              "artifacts/**",
              "build/**",
              "*.egg-info/**",
              "*.so",
              ".cache/**",
              ".pytest_cache/**",
              ".ruff_cache/**",
              "__pycache__/**",
              "**/__pycache__/**",
          )

          def git_status_entries(*arguments):
              output = subprocess.run(
                  ("git", "status", "--porcelain=v1", "-z", *arguments),
                  check=True,
                  capture_output=True,
              ).stdout.decode("utf-8")
              return [entry for entry in output.split("\0") if entry]

          def entry_path(entry):
              if len(entry) < 4 or entry[2] != " ":
                  raise SystemExit(f"unexpected porcelain entry: {entry!r}")
              return entry[3:]

          report = [
              "### Correctness-gated benchmark results",
              "",
          ]
          architecture_path = Path("artifacts/architecture-matrix.json")
          architecture = json.loads(architecture_path.read_text())
          expected_architecture_targets = [
              {"architecture": "sm80", "status": "fail_closed"},
              {"architecture": "sm90", "status": "compile_only"},
              {"architecture": "sm120", "status": "compile_only"},
          ]
          if (
              architecture["wheel_minimum_architecture"] != "sm90"
              or architecture["targets"] != expected_architecture_targets
              or architecture["runtime_validated_architectures"] != ["sm120"]
          ):
              raise SystemExit(f"invalid architecture matrix: {architecture}")
          report.extend(
              (
                  f"#### `{architecture_path.name}`",
                  "",
                  "```text",
                  "BUILD target=sm80 status=fail_closed wheel_minimum=sm90",
                  "BUILD target=sm90 status=compile_only wheel_minimum=sm90",
                  "BUILD target=sm120 status=compile_only wheel_minimum=sm90",
                  "RUNTIME architecture=sm120 status=validated",
                  "```",
                  "",
              )
          )
          benchmark_paths = (
              Path("artifacts/operator-benchmark.json"),
              Path("artifacts/training-operator-benchmark.json"),
              Path("artifacts/statetune-benchmark.json"),
              Path("artifacts/rl-infctx-benchmark.json"),
          )
          for path in benchmark_paths:
              payload = json.loads(path.read_text())
              required_identity_fields = {
                  "provider", "name", "source_revision"
              }
              if path.name in {
                  "statetune-benchmark.json",
                  "rl-infctx-benchmark.json",
              }:
                  required_identity_fields.add("mode")
              report.extend((f"#### `{path.name}`", "", "```text"))
              for row in payload["rows"]:
                  missing = sorted(required_identity_fields - row.keys())
                  if missing:
                      raise SystemExit(
                          f"{path.name} RESULT row lacks fields: {missing}"
                      )
                  if (
                      path.name == "statetune-benchmark.json"
                      and (
                          row["source_revision"] != os.environ["HEAD_SHA"]
                          or row["mode"] != "fp32io16"
                          or row["provider"] != "flash_rwkv"
                      )
                  ):
                      raise SystemExit(f"invalid StateTune RESULT identity: {row}")
                  if (
                      path.name == "rl-infctx-benchmark.json"
                      and (
                          row["source_revision"] != os.environ["HEAD_SHA"]
                          or row["mode"] != "fp32io16"
                          or row["provider"] != "flash_rwkv"
                          or not row["correctness"]["passed"]
                      )
                  ):
                      raise SystemExit(f"invalid RL-infctx RESULT identity: {row}")
                  result = (
                      f"RESULT B={row['B']} T={row['T']} iters={row['iters']} "
                      f"p10_ms={metric(row['p10_ms'])} "
                      f"p50_ms={metric(row['p50_ms'])} "
                      f"p90_ms={metric(row['p90_ms'])} "
                      f"tok_s_p50={metric(row['tok_s_p50'])} "
                      f"label={row['label']}"
                  )
                  identity = " ".join(
                      f"{field}={row[field]}"
                      for field in ("provider", "name", "source_revision", "mode")
                      if field in row
                  )
                  report.append(f"{result} {identity}".rstrip())
              report.extend(("```", ""))
              if (
                  path.name == "rl-infctx-benchmark.json"
                  and payload["source"]["tracked_source_dirty"] is not False
              ):
                  raise SystemExit("RL-infctx benchmark source checkout is dirty")

          packed_path = Path("artifacts/packed-recurrent-benchmark.json")
          packed = json.loads(packed_path.read_text())
          if packed["source"]["tracked_source_dirty"] is not False:
              raise SystemExit("packed benchmark source checkout is dirty")
          if not packed["all_cases_correct"]:
              raise SystemExit("packed recurrent correctness gate failed")
          if packed["source"]["leaf_revision"] != os.environ["HEAD_SHA"]:
              raise SystemExit("packed benchmark source revision is mismatched")
          b2048 = [
              row for row in packed["results"]
              if row["profile"] == "decode_b2048"
          ]
          if (
              len(b2048) != 2
              or {row["mode"] for row in b2048} != {"fp32io16", "fp16"}
              or any(row["sequence_count"] != 2048 for row in b2048)
              or any(
                  row["metadata_validation_complexity"]
                  != "O(sequence_count + state_pool_size)"
                  for row in b2048
              )
          ):
              raise SystemExit("B=2048 packed validator evidence is incomplete")
          graph_evidence = [
              row["device_metadata"]["cuda_graph_evidence"]
              for row in packed["results"]
              if row["device_metadata"]["cuda_graph_evidence"] is not None
          ]
          if len(graph_evidence) != 2 or not all(
              evidence["cuda_graph_capture_succeeded"]
              and evidence["cu_seqlens_identity_preserved"]
              and evidence["state_indices_identity_preserved"]
              for evidence in graph_evidence
          ):
              raise SystemExit("packed device metadata evidence is incomplete")
          report.extend((f"#### `{packed_path.name}`", "", "```text"))
          for row in packed["results"]:
              measurement = row["measurements"]
              if measurement is None:
                  raise SystemExit("packed recurrent measurement is missing")
              latency = measurement["stateful_steady_state"]["latency_ms"]
              report.append(
                  f"RESULT B={row['sequence_count']} T={row['total_tokens']} "
                  f"iters={packed['samples'] * packed['stateful_sample_iters']} "
                  f"p10_ms={metric(latency['p10'])} "
                  f"p50_ms={metric(latency['p50'])} "
                  f"p90_ms={metric(latency['p90'])} "
                  f"tok_s_p50={metric(latency['useful_tokens_per_s_p50'])} "
                  f"label=packed-{row['profile']}-{row['mode']} "
                  f"provider={row['provider']} mode={row['mode']} "
                  f"source_revision={packed['source']['leaf_revision']}"
              )
          report.extend(("```", ""))
          Path("artifacts/benchmark-report.md").write_text(
              "\n".join(report), encoding="utf-8"
          )

          prebuild = json.loads(
              Path(os.environ["PREBUILD_PROVENANCE"]).read_text(encoding="utf-8")
          )
          if (
              prebuild["head_sha"] != os.environ["HEAD_SHA"]
              or len(prebuild["runtime_semantic_revision"]) != 40
              or prebuild["tracked_source_dirty"]
              or prebuild["index_dirty"]
              or prebuild["worktree_diff_paths"]
          ):
              raise SystemExit(f"invalid prebuild provenance: {prebuild}")
          Path("artifacts/prebuild-provenance.json").write_text(
              json.dumps(prebuild, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          postbuild_entries = git_status_entries("--untracked-files=all")
          non_ignored_untracked_paths = [
              entry_path(entry)
              for entry in postbuild_entries
              if entry.startswith("?? ")
          ]
          tracked_status_entries = [
              entry
              for entry in postbuild_entries
              if not entry.startswith("?? ")
          ]
          ignored_entries = git_status_entries(
              "--ignored=matching",
              "--untracked-files=normal",
          )
          ignored_generated_paths = [
              entry_path(entry)
              for entry in ignored_entries
              if entry.startswith("!! ")
          ]
          unexpected_ignored_paths = [
              path
              for path in ignored_generated_paths
              if not any(
                  fnmatch.fnmatchcase(path, pattern)
                  for pattern in generated_path_allowlist
              )
          ]
          postbuild = {
              "head_sha": os.environ["HEAD_SHA"],
              "tracked_source_dirty": bool(tracked_status_entries),
              "tracked_status_entries": tracked_status_entries,
              "non_ignored_untracked_paths": non_ignored_untracked_paths,
              "controlled_generated_path_patterns": generated_path_allowlist,
              "ignored_generated_paths": ignored_generated_paths,
              "unexpected_ignored_paths": unexpected_ignored_paths,
          }
          if (
              postbuild["tracked_source_dirty"]
              or non_ignored_untracked_paths
              or unexpected_ignored_paths
          ):
              raise SystemExit(f"uncontrolled postbuild checkout paths: {postbuild}")
          Path("artifacts/postbuild-provenance.json").write_text(
              json.dumps(postbuild, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          files = sorted(Path("artifacts").glob("*"))
          inventory = []
          for path in files:
              inventory.append({
                  "path": path.name,
                  "size_bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          Path("artifacts/run-identity.json").write_text(json.dumps({
              "head_sha": os.environ["HEAD_SHA"],
              "runtime_semantic_revision": prebuild["runtime_semantic_revision"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "files": inventory,
          }, indent=2, sort_keys=True) + "\n")
          PY
      - name: Upload revision-bound evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: flash-rwkv-pro6000-${{ steps.target.outputs.head_sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Update pull request report
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- flash-rwkv-pro6000-report -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const benchmarkReport = fs.readFileSync(
              'artifacts/benchmark-report.md', 'utf8').trim();
            const runIdentity = JSON.parse(
              fs.readFileSync('artifacts/run-identity.json', 'utf8'));
            const {data: jobs} = await github.rest.actions.listJobsForWorkflowRunAttempt({
              ...context.repo,
              run_id: context.runId,
              attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
            });
            const currentJob = jobs.jobs.find(job => job.name === 'trusted-source');
            if (!currentJob) {
              core.setFailed('trusted-source job identity is unavailable');
              return;
            }
            const {data: pull} = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            });
            if (pull.head.sha !== process.env.HEAD_SHA) {
              core.setFailed(
                `pull request head changed to ${pull.head.sha}; ` +
                `refusing to write evidence for ${process.env.HEAD_SHA}`);
              return;
            }
            const body = [
              marker,
              '### FlashRWKV PRO 6000 GPU report',
              '',
              `- Head: \`${process.env.HEAD_SHA}\``,
              `- Runtime semantic revision: \`${runIdentity.runtime_semantic_revision}\``,
              `- Run: \`${context.runId}\` (attempt \`${process.env.GITHUB_RUN_ATTEMPT}\`)`,
              `- Job: \`${currentJob.id}\` (${currentJob.html_url})`,
              `- Artifact: \`${process.env.ARTIFACT_ID}\` (${process.env.ARTIFACT_URL})`,
              `- Artifact SHA-256: \`${process.env.ARTIFACT_DIGEST}\``,
              '- Runner contract: `rwkv-sha-pro6000x8`, single NVIDIA RTX PRO 6000 Blackwell Workstation Edition',
              '',
              benchmarkReport,
            ].join('\n');
            const {data: comments} = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body,
              });
            }
            const currentBody = pull.body || '';
            const markerIndex = currentBody.indexOf(marker);
            const prefix = (
              markerIndex === -1 ? currentBody : currentBody.slice(0, markerIndex)
            ).trimEnd();
            await github.rest.pulls.update({
              ...context.repo,
              pull_number: prNumber,
              body: `${prefix}${prefix ? '\n\n' : ''}${body}`,
            });

  untrusted-fork-notice:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Native CUDA from untrusted pull requests is not executed on the self-hosted GPU runner."
